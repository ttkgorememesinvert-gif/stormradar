name: Build StormRadar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o zip do projeto
        run: |
          curl -L -o project.zip https://github.com/${{ github.repository }}/raw/${{ github.sha }}/StormRadar-pronto-para-github.zip
          mkdir extracted
          unzip -q project.zip -d extracted

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compilar
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Guardar o .jar pronto
        uses: actions/upload-artifact@v4
        with:
          name: StormRadar-jar
          path: extracted/build/libs/*.jar
